    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.8);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(-45deg, #fbcfe8, #ffffff, #e9d5ff, #bfdbfe);
            background-size: 300% 300%;
            animation: gradientBG 20s ease infinite;
            color: #334155;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.3;
            z-index: 1;
            background-image: radial-gradient(circle at center, rgba(255,255,255,0.8) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(130%);
            -webkit-backdrop-filter: blur(20px) saturate(130%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-top: 1.5px solid rgba(255, 255, 255, 0.95);
            border-left: 1.5px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 24px 50px -12px rgba(233, 213, 255, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
            transform: translateZ(0);
            isolation: isolate;
        }

        .links-container:hover .link { opacity: 0.65; filter: blur(0.5px); }
        .links-container .link:hover { opacity: 1; filter: blur(0); z-index: 10; }

        .link {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.7);
            transition: all 0.5s var(--spring);
            position: relative;
            overflow: hidden;
            will-change: transform, box-shadow;
        }

        .link::before {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
            transform: skewX(-25deg);
            transition: left 0.7s ease-in-out;
            z-index: 1;
        }

        .link:hover::before { left: 200%; }

        .link:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 16px 30px -10px rgba(244, 114, 182, 0.3);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(254, 240, 138, 0.8);
        }

        .link:active {
            transform: scale(0.96) translateY(2px);
            box-shadow: 0 4px 10px rgba(244, 114, 182, 0.2);
            transition: all 0.15s;
        }

        :focus-visible { outline: none; box-shadow: 0 0 0 3px #fff, 0 0 0 6px #fef08a; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #f472b6; }
    </style>
</head>
