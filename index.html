        .noise-overlay {

        }

        @keyframes gradientBG { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        /* Double Beveling & Hardware Accelerated Glass */
        .glass-card {
            background: rgba(255, 255, 255, 0.55);
            /* Backdrop filter constrained specifically to the card */
            backdrop-filter: blur(16px) saturate(150%); 
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            /* Double-bevel inner shadowing for volumetric thickness */
            box-shadow: 0 12px 40px 0 rgba(255, 209, 220, 0.4), inset 1px 1px 0 rgba(255, 255, 255, 0.9), inset -1px -1px 0 rgba(255, 255, 255, 0.3), inset 0 4px 12px rgba(255, 255, 255, 0.8);
            /* CSS Containment to prevent full-page reflows */
            contain: layout paint;
            isolation: isolate;
        }

        /* Cubic-Bezier Spring Physics */
        .link-item { 
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); 
            position: relative; 
            overflow: hidden; 
            /* GPU Rasterization forcing */
            transform: translateZ(0); 
        }

        .link-item::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            /* 45-degree angled shimmer */
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            transform: skewX(-20deg); transition: left 0.6s ease; z-index: 1;
        }

        .link-item:hover { 
            transform: translateY(-4px) scale(1.01); 
            /* Saturated hover shadowing */
            box-shadow: 0 14px 24px -10px rgba(212, 175, 55, 0.4); 
            border-color: rgba(212, 175, 55, 0.5); 
            background: rgba(255, 255, 255, 0.95); 
        }

        .link-item:hover::after { left: 200%; }

        /* Deep Active Press State */
        .active-press:active { 
            transform: scale(0.95) translateY(0); 
            box-shadow: 0 4px 10px -5px rgba(212, 175, 55, 0.2);
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s ease; 
        }

        /* Accessibility: Focus Trap Prevention & Focus-Visible Outset */
        *:focus-visible { 
            outline: none; 
            box-shadow: 0 0 0 3px #fff, 0 0 0 6px #d4af37; 
            border-radius: inherit; 
        }

        /* High Contrast Text Selection */
        ::selection { background: #ec4899; color: #fff; }

        /* Scrollbar Polish */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fff9c4; }
        ::-webkit-scrollbar-thumb { background: #ffd1dc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }

        /* Staggered Loading Classes */
        .delay-100 { animation-delay: 100ms; } 
        .delay-200 { animation-delay: 200ms; } 
        .delay-300 { animation-delay: 300ms; } 
        .delay-400 { animation-delay: 400ms; } 
        .delay-500 { animation-delay: 500ms; }
        .delay-700 { animation-delay: 700ms; }

        /* WCAG: Reduced Motion Fallback */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after { 
                animation: none !important; 
                transition: none !important; 
            }
            .opacity-0 { opacity: 1 !important; }
        }
