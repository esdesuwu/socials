<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffd1dc">
    <meta name="description" content="David Tapia's Links">
    <title>David Tapia Links</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'moon-pink': '#ffd1dc',    
                        'moon-blue': '#cce7ff',    
                        'moon-yellow': '#fff9c4',  
                        'moon-dark': '#334155',    
                        'moon-gold': '#d4af37',    
                    },
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'sparkle': 'sparkle 2.5s ease-in-out infinite',
                        'spin-slow': 'spin 12s linear infinite',
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        sparkle: {
                            '0%, 100%': { opacity: '0.3', transform: 'scale(0.8)' },
                            '50%': { opacity: '1', transform: 'scale(1.1) rotate(15deg)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px) scale(0.95)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { filter: 'drop-shadow(0 0 4px rgba(212, 175, 55, 0.4))' },
                            '50%': { filter: 'drop-shadow(0 0 12px rgba(212, 175, 55, 0.8))' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(-45deg, #ffd1dc, #ffffff, #cce7ff, #fff9c4);
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
            color: #334155;
        }
        .noise-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 12px 40px 0 rgba(255, 209, 220, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.6), inset 0 4px 12px rgba(255, 255, 255, 0.8);
        }
        .link-item { transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; overflow: hidden; transform: translateZ(0); }
        .link-item::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            transform: skewX(-20deg); transition: left 0.6s ease; z-index: 1;
        }
        .link-item:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 14px 24px -10px rgba(212, 175, 55, 0.3); border-color: rgba(212, 175, 55, 0.5); background: rgba(255, 255, 255, 0.95); }
        .link-item:hover::after { left: 200%; }
        .active-press:active { transform: scale(0.97) translateY(0); transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        *:focus-visible { outline: none; box-shadow: 0 0 0 3px #fff, 0 0 0 6px #d4af37; border-radius: inherit; }
        .delay-100 { animation-delay: 150ms; } .delay-200 { animation-delay: 300ms; } .delay-300 { animation-delay: 450ms; } .delay-400 { animation-delay: 600ms; } .delay-500 { animation-delay: 750ms; }
        ::selection { background: #ffd1dc; color: #1e293b; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fff9c4; }
        ::-webkit-scrollbar-thumb { background: #ffd1dc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
            .animate-float, .animate-spin-slow, .animate-sparkle { animation: none !important; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 relative overflow-x-hidden font-sans">
    <div class="noise-overlay"></div>
    <main class="glass-card w-full max-w-md rounded-[2.5rem] px-8 pt-10 pb-16 sm:px-10 sm:pt-12 sm:pb-20 relative z-10 flex flex-col items-center text-center opacity-0 animate-fade-in-up shadow-xl overflow-hidden">
        
        <div class="relative w-32 h-32 mb-6 animate-float">
            <div class="absolute inset-0 rounded-full border-[3px] border-moon-gold border-dashed opacity-60 animate-spin-slow"></div>
            <div class="absolute inset-2 rounded-full bg-white/90 flex items-center justify-center overflow-hidden shadow-inner border border-white/50 backdrop-blur-sm">
                <svg class="w-14 h-14 text-moon-pink animate-pulse-glow" viewBox="0 0 24 24" fill="currentColor">
                     <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
        </div>

        <h1 class="font-serif text-2xl sm:text-3xl font-bold tracking-wide text-slate-800 mb-8 opacity-0 animate-fade-in-up delay-100">David Tapia</h1>
        
        <nav class="w-full flex flex-col gap-4">
            
            <a href="https://x.com/esdesuwu" target="_blank" rel="noopener noreferrer" class="link-item active-press opacity-0 animate-fade-in-up delay-300 w-full bg-white/70 border border-white/80 rounded-2xl p-4 flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-11 h-11 rounded-xl bg-slate-100 flex items-center justify-center text-slate-800 font-bold text-xl transition-transform group-hover:scale-110 duration-300">𝕏</div>
                    <span class="font-extrabold text-base sm:text-lg bg-clip-text text-transparent bg-gradient-to-r from-slate-700 to-slate-400 drop-shadow-sm tracking-wide group-hover:from-moon-gold group-hover:to-pink-500 transition-all duration-300">@esdesuwu</span>
                </div>
            </a>
            
            <a href="https://steamcommunity.com/id/esdesuwu" target="_blank" rel="noopener noreferrer" class="link-item active-press opacity-0 animate-fade-in-up delay-400 w-full bg-white/70 border border-white/80 rounded-2xl p-4 flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-11 h-11 rounded-xl bg-blue-100 flex items-center justify-center text-blue-500 font-bold transition-transform group-hover:scale-110 duration-300">ST</div>
                    <span class="font-extrabold text-base sm:text-lg bg-clip-text text-transparent bg-gradient-to-r from-slate-700 to-slate-400 drop-shadow-sm tracking-wide group-hover:from-moon-gold group-hover:to-pink-500 transition-all duration-300">@esdesuwu</span>
                </div>
            </a>

            <a href="https://instagram.com/esdesuwu" target="_blank" rel="noopener noreferrer" class="link-item active-press opacity-0 animate-fade-in-up delay-500 w-full bg-white/70 border border-white/80 rounded-2xl p-4 flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-11 h-11 rounded-xl bg-pink-100 flex items-center justify-center text-pink-500 font-bold transition-transform group-hover:scale-110 duration-300">IG</div>
                    <span class="font-extrabold text-base sm:text-lg bg-clip-text text-transparent bg-gradient-to-r from-slate-700 to-slate-400 drop-shadow-sm tracking-wide group-hover:from-moon-gold group-hover:to-pink-500 transition-all duration-300">@esdesuwu</span>
                </div>
            </a>

        </nav>
        
        <div class="mt-12 opacity-0 animate-fade-in-up delay-500 w-full relative z-10">
            <a href="mailto:eesdesuwu@gmail.com" class="active-press inline-flex items-center justify-center gap-2 text-sm font-bold text-pink-500 hover:text-moon-gold transition-colors py-2 px-4 rounded-full">
                eesdesuwu@gmail.com
            </a>
        </div>

        <div class="absolute bottom-5 sm:bottom-6 left-0 w-full pointer-events-none opacity-0 animate-fade-in-up delay-500 text-slate-600/40 flex justify-center">
            <svg viewBox="0 0 440 55" class="w-[95%] max-w-[440px]">
                <path id="bottomCurve" d="M 10 5 Q 220 50 430 5" fill="none" />
                <text fill="currentColor" font-family="Quicksand, sans-serif" font-weight="700" font-size="11.5" letter-spacing="0.03em">
                    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">
                        South Florida, TCG Enthusiast, Rank Iron II (Peak rank: Bronze IIl)
                    </textPath>
                </text>
            </svg>
        </div>
    </main>
</body>
</html>
